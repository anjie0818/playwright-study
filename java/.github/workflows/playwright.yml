name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  playwright:
    name: 'Playwright Tests'
    runs-on: ubuntu-latest
    container:
      # Playwright 官方 Java Docker 镜像，已内置浏览器和系统依赖
      image: mcr.microsoft.com/playwright/java:v1.56.0-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build & Install
        working-directory: java
        run: mvn -B install -DskipTests --no-transfer-progress

      - name: Run tests
        working-directory: java
        run: mvn test

      # 测试失败时上传 trace，方便调试
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: java/target/trace/trace.zip
          retention-days: 7
